<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header"><h3 class="text-center font-weight-light my-4">{{cadastrando ? 'Cadastro de novo usuário' : 'Entrar'}}</h3></div>
                            <div class="card-body">
                                <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
                                    <div class="form-group">
                                        <label class="small mb-1">Login</label>
                                        <input type="text" name="username" [(ngModel)]="username" class="form-control py-4" placeholder="Digite seu login" required />
                                    </div>
                                    <div class="form-group">
                                        <label class="small mb-1">Senha</label>
                                        <input type="password" name="password" [(ngModel)]="password" class="form-control py-4" placeholder="Digite sua senha" required />
                                    </div>
                                    <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <button type="submit" class="btn btn-primary" *ngIf="!cadastrando">Entrar</button>
                                        <button type="button" class="btn btn-success" *ngIf="cadastrando" (click)="cadastrar()">Cadastrar</button>
                                        <button type="button" class="btn btn-secondary" *ngIf="cadastrando" (click)="cancelarCadastro()">Cancelar</button>
                                    </div>
                                </form>
                                <div *ngIf="loginError" class="alert alert-danger mt-3">
                                    Login e/ou Senha incorreto(a).
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="small">Não tem uma conta? <a href="#" (click)="prepararCadastrar($event)">Cadastre-se</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
